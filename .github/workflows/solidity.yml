name: Solidity

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cumulative-gate:
    name: Phase 7 cumulative security gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FOUNDRY_PROFILE: ci

    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry v1.7.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Install Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv 0.12.5
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"

      - name: Verify Phase 7 without public RPC dependencies
        run: ./scripts/verify-phase-7.sh
