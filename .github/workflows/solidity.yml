name: Solidity

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cumulative-gate:
    name: Phase 5 deployment-independent gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOUNDRY_PROFILE: ci

    steps:
      - name: Check out pinned dependencies
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry v1.7.1
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1

      - name: Verify Phase 5 without public RPC dependencies
        run: ./scripts/verify-phase-5-local.sh --offline
